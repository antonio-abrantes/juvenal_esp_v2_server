# Publica somente após push de tag. Branches e PRs não disparam.
name: Imagem Docker → Produção

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: juvenal-image-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build e Push prod (AMD64 + ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do commit da tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validar tag e nome da imagem
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Tag fora do formato deste canal.'
            exit 1
          fi
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Preparar QEMU para ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados e tags da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod
            type=raw,value=latest
            type=sha,prefix=prod-,format=short

      - name: Build e publicação multiarch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          pull: true

      - name: Resumo
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          {
            printf '## Imagem Juvenal — Produção\n\n'
            printf 'Tag Git: %s\n\n' "$RELEASE_TAG"
            printf 'Plataformas: linux/amd64 e linux/arm64\n\n'
            printf 'Imagens publicadas:\n\n'
            while IFS= read -r tag; do
              printf -- '- %s\n' "$tag"
            done <<< "$IMAGE_TAGS"
            printf '\nDeploy manual no Portainer; nenhum serviço foi atualizado.\n'
          } >> "$GITHUB_STEP_SUMMARY"
