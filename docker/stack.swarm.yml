# Colar no editor de Stack Swarm do Portainer e importar .env em Environment variables.
# Uma réplica: estado conversacional é local ao processo. Deploy manual.
version: "3.8"
services:
  juvenal:
    image: "${JUVENAL_IMAGE:-ghcr.io/antonio-abrantes/juvenal_esp_v2_server}:${JUVENAL_IMAGE_TAG:-latest}"
    environment:
      # Backend somente na rede interna, com entrada pública pelo Traefik.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
      # Caminhos e capacidades próprios do container: não herdar caminhos Windows.
      JUVENAL_HOST: "0.0.0.0"
      JUVENAL_PORT: "8000"
      JUVENAL_ENV_FILE: /config/juvenal.env
      JUVENAL_DATA_DIR: /data
      SYSTEM_PROMPT_PATH: /config/system_prompt.md
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      LOCAL_VOICE_ENABLED: "false"
      WHISPER_DEVICE: cpu
      TTS_BACKEND: piper
      PIPER_USE_CUDA: "false"
      PANEL_USERNAME: "${PANEL_USERNAME:?Defina PANEL_USERNAME no Portainer}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:?Defina PANEL_PASSWORD no Portainer}"
      ESP_DEVICE_TOKEN: "${ESP_DEVICE_TOKEN:?Defina ESP_DEVICE_TOKEN igual ao ESP}"
      TZ: "${TZ:-America/Sao_Paulo}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434/v1}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      CUSTOM_LLM_BASE_URL: "${CUSTOM_LLM_BASE_URL:-}"
      CUSTOM_LLM_API_KEY: "${CUSTOM_LLM_API_KEY:-}"
      CUSTOM_LLM_MODEL: "${CUSTOM_LLM_MODEL:-}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_API_KEY: "${WEBHOOK_API_KEY:-}"
      AUDIO_OUTPUT_MODE: "${AUDIO_OUTPUT_MODE:-esp32}"
      STT_ENABLED: "${STT_ENABLED:-true}"
      WHISPER_MODEL_SIZE: "${WHISPER_MODEL_SIZE:-base}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-pt}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_BEAM_SIZE: "${WHISPER_BEAM_SIZE:-1}"
      WHISPER_TEMPERATURE: "${WHISPER_TEMPERATURE:-0.0}"
      WHISPER_NO_SPEECH_THRESHOLD: "${WHISPER_NO_SPEECH_THRESHOLD:-0.7}"
      WHISPER_CONDITION_ON_PREVIOUS_TEXT: "${WHISPER_CONDITION_ON_PREVIOUS_TEXT:-true}"
      PIPER_MODEL: "${PIPER_MODEL:-pt_BR-faber-medium}"
      PIPER_LENGTH_SCALE: "${PIPER_LENGTH_SCALE:-1.0}"
      PIPER_VOLUME: "${PIPER_VOLUME:-1.0}"
      AUDIO_TEXT_ENDPOINT_URL: "${AUDIO_TEXT_ENDPOINT_URL:-}"
      AUDIO_TEXT_ENDPOINT_FORMAT: "${AUDIO_TEXT_ENDPOINT_FORMAT:-json}"
      AUDIO_TEXT_ENDPOINT_SUCCESS_STATUSES: "${AUDIO_TEXT_ENDPOINT_SUCCESS_STATUSES:-200,201,202}"
      AUDIO_TEXT_ENDPOINT_TIMEOUT_SECONDS: "${AUDIO_TEXT_ENDPOINT_TIMEOUT_SECONDS:-10}"
      AUDIO_TEXT_ENDPOINT_LOG_RESPONSE: "${AUDIO_TEXT_ENDPOINT_LOG_RESPONSE:-false}"
      AUDIO_TEXT_ENDPOINT_API_KEY: "${AUDIO_TEXT_ENDPOINT_API_KEY:-}"
      AUDIO_TEXT_ENDPOINT_AUTH_HEADER: "${AUDIO_TEXT_ENDPOINT_AUTH_HEADER:-}"
      AUDIO_TEXT_ENDPOINT_AUTH_PREFIX: "${AUDIO_TEXT_ENDPOINT_AUTH_PREFIX:-}"
      LOG_TRANSCRIPTS: "${LOG_TRANSCRIPTS:-false}"
      ESP_DEVICE_ID: "${ESP_DEVICE_ID:-juvenal}"
      ESP_LEGACY_ENABLED: "${ESP_LEGACY_ENABLED:-false}"
      ESP_VAD_START_RMS: "${ESP_VAD_START_RMS:-300}"
      ESP_VAD_END_RMS: "${ESP_VAD_END_RMS:-100}"
      ESP_VAD_SILENCE_SECONDS: "${ESP_VAD_SILENCE_SECONDS:-1.8}"
      ESP_MAX_INPUT_SECONDS: "${ESP_MAX_INPUT_SECONDS:-30}"
      ESP_MAX_PLAYBACK_SECONDS: "${ESP_MAX_PLAYBACK_SECONDS:-60}"
      ESP_HANDSHAKE_SECONDS: "${ESP_HANDSHAKE_SECONDS:-5}"
      CONVERSATION_IDLE_TIMEOUT_SECONDS: "${CONVERSATION_IDLE_TIMEOUT_SECONDS:-10}"
      CONVERSATION_TIMEOUT: "${CONVERSATION_TIMEOUT:-15}"
      ESP_SILENCE_TIMEOUT: "${ESP_SILENCE_TIMEOUT:-1.8}"
      IDLE_MESSAGE_ENABLED: "${IDLE_MESSAGE_ENABLED:-true}"
      IDLE_MESSAGE: "${IDLE_MESSAGE:-Estou voltando ao modo de espera. Me chame quando precisar!}"
      CONTEXT_MAX_MESSAGES: "${CONTEXT_MAX_MESSAGES:-20}"
      CONTEXT_MAX_BYTES: "${CONTEXT_MAX_BYTES:-65536}"
      CONTEXT_TTL_SECONDS: "${CONTEXT_TTL_SECONDS:-1800}"
      CONTEXT_MAX_COUNT: "${CONTEXT_MAX_COUNT:-8}"
      RESPONSE_MAX_BYTES: "${RESPONSE_MAX_BYTES:-32768}"
      TOKEN_QUEUE_MAX_BYTES: "${TOKEN_QUEUE_MAX_BYTES:-65536}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-60}"
      INTERACTION_TIMEOUT_SECONDS: "${INTERACTION_TIMEOUT_SECONDS:-180}"
      DELIVERY_TIMEOUT_SECONDS: "${DELIVERY_TIMEOUT_SECONDS:-60}"
      INTERNET_ENABLED: "${INTERNET_ENABLED:-false}"
      WEATHER_ENABLED: "${WEATHER_ENABLED:-true}"
      CURRENCY_ENABLED: "${CURRENCY_ENABLED:-true}"
      WEB_SEARCH_ENABLED: "${WEB_SEARCH_ENABLED:-true}"
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-duckduckgo}"
      WEATHER_DEFAULT_LOCATION: "${WEATHER_DEFAULT_LOCATION:-}"
      INTERNET_TIMEOUT_SECONDS: "${INTERNET_TIMEOUT_SECONDS:-8}"
      INTERNET_MAX_RESULTS: "${INTERNET_MAX_RESULTS:-3}"
      INTERNET_CACHE_TTL_SECONDS: "${INTERNET_CACHE_TTL_SECONDS:-300}"
      INTERNET_LOG_CONTENT: "${INTERNET_LOG_CONTENT:-false}"
      HASS_ENABLED: "${HASS_ENABLED:-true}"
      HASS_MODE: "${HASS_MODE:-api}"
      HASS_API_ENDPOINT: "${HASS_API_ENDPOINT:-}"
      HASS_API_TOKEN: "${HASS_API_TOKEN:-}"
      HASS_AGENT_ID: "${HASS_AGENT_ID:-conversation.extended_openai_conversation_2}"
      HASS_REQUEST_TIMEOUT_SECONDS: "${HASS_REQUEST_TIMEOUT_SECONDS:-30}"
      HASS_LOG_CONTENT: "${HASS_LOG_CONTENT:-false}"
      HASS_REQUIRE_CATALOG: "${HASS_REQUIRE_CATALOG:-false}"
      HASS_TEXT_ENDPOINT_URL: "${HASS_TEXT_ENDPOINT_URL:-}"
      HASS_TEXT_ENDPOINT_FIELD: "${HASS_TEXT_ENDPOINT_FIELD:-mensagem}"
      HASS_TEXT_ENDPOINT_API_KEY: "${HASS_TEXT_ENDPOINT_API_KEY:-}"
      HASS_TEXT_ENDPOINT_AUTH_HEADER: "${HASS_TEXT_ENDPOINT_AUTH_HEADER:-}"
      HASS_TEXT_ENDPOINT_AUTH_PREFIX: "${HASS_TEXT_ENDPOINT_AUTH_PREFIX:-}"
      TOOLS_ENABLED: "${TOOLS_ENABLED:-false}"
      LLM_TOOL_CALLING_CONFIRMED: "${LLM_TOOL_CALLING_CONFIRMED:-false}"
      LLM_TOOL_CALLING_PROVIDER: "${LLM_TOOL_CALLING_PROVIDER:-}"
      LLM_TOOL_CALLING_MODEL: "${LLM_TOOL_CALLING_MODEL:-}"
      LLM_TOOL_CALLING_ADAPTER: "${LLM_TOOL_CALLING_ADAPTER:-openai-chat-completions}"
      TOOL_TIMEOUT_SECONDS: "${TOOL_TIMEOUT_SECONDS:-15}"
      TOOL_CONFIRMATION_TTL_SECONDS: "${TOOL_CONFIRMATION_TTL_SECONDS:-60}"
      TOOL_MAX_ROUNDS: "${TOOL_MAX_ROUNDS:-3}"
      TOOL_MAX_CALLS: "${TOOL_MAX_CALLS:-4}"
      AUTOMATION_CATALOG_MAX_BYTES: "${AUTOMATION_CATALOG_MAX_BYTES:-262144}"
      AUTOMATION_CATALOG_MAX_ENTRIES: "${AUTOMATION_CATALOG_MAX_ENTRIES:-200}"
    volumes:
      - juvenal_config:/config
      - juvenal_data:/data
      - juvenal_cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-network_public}"
        - "traefik.http.routers.juvenal.rule=Host(`${JUVENAL_DOMAIN:?Defina JUVENAL_DOMAIN no Portainer}`)"
        - "traefik.http.routers.juvenal.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.juvenal.tls=true"
        - "traefik.http.routers.juvenal.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptresolver}"
        - "traefik.http.routers.juvenal.service=juvenal"
        - "traefik.http.services.juvenal.loadbalancer.server.port=8000"
        - "traefik.http.services.juvenal.loadbalancer.passHostHeader=true"

networks:
  network_public:
    external: true
    name: "${TRAEFIK_NETWORK:-network_public}"

volumes:
  juvenal_config:
  juvenal_data:
  juvenal_cache:
